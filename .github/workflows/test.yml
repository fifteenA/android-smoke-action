# Runs this action on a public F-Droid APK: once where the text shows, once where it can't.
name: test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: test
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOBILESANDBOX_USER_AGENT: MobileboxInternal # our own CI, kept out of usage counts
    steps:
      - uses: actions/checkout@v7
      - run: curl -sfL -o calculator.apk https://f-droid.org/repo/org.fossify.math_10.apk
      - id: pass
        uses: ./
        with:
          apk: calculator.apk
          wait-for: '='
          api-key: ${{ secrets.MOBILESANDBOX_API_KEY }}
      - id: fail
        uses: ./
        continue-on-error: true
        with:
          apk: calculator.apk
          wait-for: Sign in
          timeout: 5
          api-key: ${{ secrets.MOBILESANDBOX_API_KEY }}
          artifact-name: android-smoke-expected-fail
      - run: |
          echo "pass: ${{ steps.pass.outputs.result }} ${{ steps.pass.outputs.phone-id }} ${{ steps.pass.outputs.screenshot }}"
          echo "fail: ${{ steps.fail.outputs.result }} ${{ steps.fail.outputs.phone-id }}"
          test "${{ steps.pass.outputs.result }}" = pass
          test "${{ steps.fail.outputs.result }}" = fail
